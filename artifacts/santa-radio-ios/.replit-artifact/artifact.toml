kind = "mobile"
previewPath = "/"
title = "Santa Radio iPhone"
description = "Santa Radio's iPhone companion with free Santa greetings, Apple-purchased Santa Studio messages, live radio, Santa Dash and an estimated seasonal tracker."
version = "1.0.0"
id = "artifacts/santa-radio-ios"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = ["/"]
localPort = 24826

[services.development]
run = "pnpm --filter @workspace/santa-radio-ios run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/santa-radio-ios", "run", "build"]
run = ["pnpm", "--filter", "@workspace/santa-radio-ios", "run", "serve"]

[services.env]
PORT = "24826"
BASE_PATH = "/"

[[services]]
name = "website"
paths = ["/api"]
localPort = 5000
ensurePreviewReachable = "/"

[services.development]
run = "cd ../.. && npm run dev"

[services.production]
build = ["sh", "-c", "cd ../.. && npm run build"]
run = ["sh", "-c", "cd ../.. && npm start"]
